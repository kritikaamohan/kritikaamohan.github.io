<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="fav-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="fav-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Modern Continuous-Curvature Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#fav-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="none" stroke="rgba(255,255,255,0.24)" stroke-width="1.5"/>

  <!-- High-Precision AI/ML 'K' Monogram -->
  <g filter="url(#fav-shadow)">
    <!-- Vertical Spine -->
    <rect x="14" y="14" width="7.5" height="36" rx="3.75" fill="url(#fav-accent)"/>

    <!-- Upper Branch -->
    <path d="M20 29.5 L36.8 15.2 C37.8 14.3 39.4 15 39.4 16.3 L39.4 19.8 C39.4 20.8 38.9 21.8 38 22.5 L24.5 33.5 Z" fill="url(#fav-accent)"/>

    <!-- Lower Branch -->
    <path d="M23.5 30 L40.2 46.8 C41.1 47.7 40.5 49.5 39.2 49.5 L35.5 49.5 C34.6 49.5 33.7 49.1 33.1 48.4 L19.5 34 Z" fill="url(#fav-accent)"/>

    <!-- Glowing AI Star Accent -->
    <path d="M47 13 C47 18 43 19.5 38.5 19.5 C43 19.5 47 21 47 26 C47 21 51 19.5 55.5 19.5 C51 19.5 47 18 47 13 Z" fill="url(#fav-sparkle)"/>
    <circle cx="47" cy="19.5" r="1.8" fill="#ffffff"/>
  </g>
</svg>
